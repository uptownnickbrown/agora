[project]
name = "agora-backend"
version = "0.1.0"
description = "Agora — multiplayer economic simulation courseware (backend + sim harness)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",      # sync driver for alembic
    "alembic>=1.14",
    "pydantic[email]>=2.9",      # EmailStr validation (auth/roster)
    "pydantic-settings>=2.6",
    "arq>=0.26",                 # Redis-backed workers (ticks/jobs)
    "redis>=5.2",
    "argon2-cffi>=23.1",         # password hashing (optional alongside magic links)
    "anthropic>=0.40",           # tutor / pedagogy layer (Phase 1)
    "httpx>=0.27",
]

[project.optional-dependencies]
# beautifulsoup4 is only for scripts/scrape_openstax.py (a dev-time content
# refresh); the app itself never fetches — the scraped text ships committed
# in app/pedagogy/openstax.py.
dev = ["pytest>=8.0", "ruff>=0.7", "beautifulsoup4>=4.12"]


[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "sim*"]
