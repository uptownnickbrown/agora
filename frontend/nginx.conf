server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Re-resolve the upstream per request: with a static proxy_pass nginx
        # caches the api container's IP at startup and serves 502s after the
        # api is recreated (true for compose rebuilds AND platform redeploys).
        # 127.0.0.11 is Docker's embedded DNS; override for other platforms.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
