services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora
      POSTGRES_DB: agora
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    environment:
      AGORA_DATABASE_URL: postgresql+asyncpg://agora:agora@postgres:5432/agora
      AGORA_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [postgres, redis]

  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    environment:
      AGORA_DATABASE_URL: postgresql+asyncpg://agora:agora@postgres:5432/agora
      AGORA_REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
